name: CI Core

on:
  push:
    branches:
      - core

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "CI passed"

  approve:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Waiting for production approval"
